[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talude-v1"
version = "0.1.0"
description = "Extração automática 3D de linhas de crista e pé de talude a partir de nuvens de pontos."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "laspy[lazrs]>=2.5,<3",
  "ezdxf>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
talude-v1 = "talude_v1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
